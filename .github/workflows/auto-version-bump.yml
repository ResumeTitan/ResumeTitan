name: Auto Version Bump

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  version-bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js for server
        uses: actions/setup-node@v4
        with:
          node-version: '21.6.2'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Setup Node.js for client
        uses: actions/setup-node@v4
        with:
          node-version: '21.6.2'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Get current version from client package.json
        id: client-version
        run: |
          CLIENT_VERSION=$(node -p "require('./client/package.json').version")
          echo "current_client_version=$CLIENT_VERSION" >> $GITHUB_OUTPUT
          echo "Current client version: $CLIENT_VERSION"

      - name: Get current version from server package.json
        id: server-version
        run: |
          SERVER_VERSION=$(node -p "require('./server/package.json').version")
          echo "current_server_version=$SERVER_VERSION" >> $GITHUB_OUTPUT
          echo "Current server version: $SERVER_VERSION"

      - name: Bump client version
        id: bump-client
        run: |
          cd client
          npm version patch --no-git-tag-version
          NEW_CLIENT_VERSION=$(node -p "require('./package.json').version")
          echo "new_client_version=$NEW_CLIENT_VERSION" >> $GITHUB_OUTPUT
          echo "New client version: $NEW_CLIENT_VERSION"

      - name: Bump server version
        id: bump-server
        run: |
          cd server
          npm version patch --no-git-tag-version
          NEW_SERVER_VERSION=$(node -p "require('./package.json').version")
          echo "new_server_version=$NEW_SERVER_VERSION" >> $GITHUB_OUTPUT
          echo "New server version: $NEW_SERVER_VERSION"

      - name: Create commit and push changes
        run: |
          git add client/package.json server/package.json
          git commit -m "chore: auto-bump versions

          Client: ${{ steps.client-version.outputs.current_client_version }} → ${{ steps.bump-client.outputs.new_client_version }}
          Server: ${{ steps.server-version.outputs.current_server_version }} → ${{ steps.bump-server.outputs.new_server_version }}"
          git push origin develop

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.bump-client.outputs.new_client_version }}
          release_name: Release v${{ steps.bump-client.outputs.new_client_version }}
          body: |
            ## Version Bump
            
            ### Client
            - Previous: ${{ steps.client-version.outputs.current_client_version }}
            - New: ${{ steps.bump-client.outputs.new_client_version }}
            
            ### Server
            - Previous: ${{ steps.server-version.outputs.current_server_version }}
            - New: ${{ steps.bump-server.outputs.new_server_version }}
            
            ---
            
            This release was automatically generated by GitHub Actions.
          draft: false
          prerelease: false 