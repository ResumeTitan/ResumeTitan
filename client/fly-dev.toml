# fly.toml app configuration file generated for resumegpt-client-dev on 2025-05-31T00:00:01-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'resumegpt-client-dev'
primary_region = 'iad'

[build]
  dockerfile = "Dockerfile.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
