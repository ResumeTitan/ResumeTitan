# fly.toml app configuration file generated for resumegpt-server on 2023-07-06T20:47:23-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "resumegpt-server"
primary_region = "iad"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "16gb"
  cpus = 8
  cpu_kind = "performance"
  kernel_args = ["no-hlt=true"]
  processes = ["app"]
